name: Bargazal Health Check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Bargazal backend
        run: |
          response=$(curl -sS \
            -o /tmp/health.json \
            -w "%{http_code}" \
            --max-time 30 \
            "https://www.bargazalandsonstechs.me/api/public/health")

          echo "HTTP status: $response"
          cat /tmp/health.json

          if [ "$response" != "200" ]; then
            echo "Health check failed"
            exit 1
          fi

          if ! grep -q '"status":"ok"' /tmp/health.json; then
            echo "Backend/database health check failed"
            exit 1
          fi

          echo "Bargazal backend is healthy"
